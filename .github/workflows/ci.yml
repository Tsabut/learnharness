name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: OAuth protocol, vault, and desktop security on this OS
        run: node --import tsx --test --test-concurrency=2 tests/openai-oauth-flow.test.ts tests/openai-credentials.test.ts tests/openai-auth-service.test.ts tests/openai-plan-request.test.ts tests/openai-desktop-security.test.ts tests/desktop-platform.test.ts tests/browser-service-lifetime.test.ts
        env:
          NODE_ENV: test
      - name: Real OS-protected OAuth key persistence (Windows/macOS)
        if: runner.os != 'Linux'
        run: node node_modules/electron/cli.js scripts/smoke-oauth-storage.cjs --expect-encrypted
      - name: Refuse Linux basic_text storage with real Electron
        if: runner.os == 'Linux'
        # An isolated native basic_text provider must disable OAuth, not
        # pretend that fallback encryption protects credentials. No keyring
        # or host settings are installed or modified by this check. The
        # no-window probe alone bypasses Chromium's sandbox on CI runners
        # that prohibit npm Electron's user namespaces (Ubuntu 24.04).
        run: xvfb-run -a node node_modules/electron/cli.js scripts/smoke-oauth-storage.cjs --linux-basic --expect-unavailable --no-sandbox
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
